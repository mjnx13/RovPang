# 고정 위치 집기·하역 (pick_place_server). 펄스 [ID1, ID2, ID3, ID4, ID5], 그리퍼 ID10
# 출처: 팀장 11/25 보고서 navigation_pick 동작 (내리기 [500,190,300,300,500], 열기 200, 닫기 560, 들기 [500,700,15,215,500])
pick_place_server:
  ros__parameters:
    dry_run: false
    grasp_pose:   [500, 190, 300, 300, 500]
    lift_pose:    [500, 700, 15, 215, 500]
    place_pose:   [500, 190, 300, 300, 500]
    retract_pose: [500, 765, 15, 150, 500]
    gripper_open: 200
    gripper_close: 560
    grasped_max: 545
    move_time: 2.5
    grip_time: 1.0
    expected_xyz: [0.007, 0.097, 0.335]   # 보정 후 LOOK_DOWN 에서 집는 자리 물품의 카메라 좌표(m)로 바꾸기
    tolerance: 0.04
